<!doctype html>
<!--
  Local execution consent surface.

  Structure, copy, colour tokens and interaction rules are taken from the
  shipped .vite/renderer/local_exec_consent/localExecConsent.html and its
  script (Claude 2.42304.0). Like the original, this page is deliberately
  dependency-free: no framework, no windowBase. Content arrives through the
  query string and is written with textContent only, so nothing the content
  view can influence is ever parsed as markup.

  Differences from the original are recorded in evidence/STATUS.md: the copy is
  Chinese, and the connector/3P variants are not implemented because this
  reconstruction has no MCP host.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'" />
    <style>
      :root {
        --bg: #f9f9f7;
        --fg: #0b0b0b;
        --dim: #52514e;
        --border: rgba(11, 11, 11, 0.1);
        --hover: rgba(11, 11, 11, 0.05);
        --hover-strong: rgba(11, 11, 11, 0.1);
        --warn: rgba(217, 119, 6, 0.08);
        --warn-border: rgba(217, 119, 6, 0.25);
        --primary-fg: #f9f9f7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0b;
          --fg: #ffffff;
          --dim: #c3c2b7;
          --border: rgba(255, 255, 255, 0.1);
          --hover: rgba(255, 255, 255, 0.1);
          --hover-strong: rgba(255, 255, 255, 0.14);
          --warn: rgba(245, 158, 11, 0.1);
          --warn-border: rgba(245, 158, 11, 0.25);
          --primary-fg: #0b0b0b;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 "Anthropic Sans Variable", "Anthropic Sans",
          -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      .dialog { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .dialog:focus { outline: none; }
      header { padding: 22px 24px 0; }
      h1 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
        display: flex;
        align-items: center;
        gap: 9px;
        overflow-wrap: anywhere;
      }
      h1 svg { width: 20px; height: 20px; flex-shrink: 0; }
      #title {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        unicode-bidi: isolate;
      }
      .desc { font-size: 14px; line-height: 1.55; margin: 0; color: var(--dim); }
      .warn {
        margin: 14px 24px 0;
        padding: 11px 13px;
        border-radius: 8px;
        background: var(--warn);
        border: 1px solid var(--warn-border);
        font-size: 12.5px;
        display: flex;
        align-items: flex-start;
        gap: 9px;
      }
      .warn[hidden] { display: none; }
      .warn svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
      .body-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 4px; }
      .targets { list-style: none; margin: 14px 24px 0; padding: 0; }
      .targets[hidden] { display: none; }
      .targets li { margin-bottom: 8px; }
      .targets details {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 11px;
      }
      .targets summary {
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: baseline;
        gap: 8px;
        overflow-wrap: anywhere;
      }
      .targets summary .origin {
        color: var(--dim);
        font-size: 11.5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .targets .detail {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        color: var(--dim);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #trust-note { margin: 14px 24px 0; font-size: 12.5px; }
      #trust-note[hidden] { display: none; }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 16px 24px 20px;
      }
      .btn {
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        height: 32px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      .btn:hover:not(:disabled) { background: var(--hover); }
      .btn:active:not(:disabled) { background: var(--hover-strong); }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
      #allow {
        background: var(--fg);
        color: var(--primary-fg);
        border-color: transparent;
      }
      #allow:hover:not(:disabled) { opacity: 0.9; background: var(--fg); }
    </style>
  </head>
  <body>
    <div
      class="dialog"
      id="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="title"
      aria-describedby="desc"
      tabindex="-1"
    >
      <header>
        <h1>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" />
            <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" />
          </svg>
          <span id="title"></span>
        </h1>
        <p class="desc" id="desc"></p>
      </header>
      <div class="body-scroll">
        <div class="warn" id="warn" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="11" width="14" height="9" rx="2" />
            <path d="M8 11V8a4 4 0 0 1 8 0v3" />
          </svg>
          <span>断开后会清除此设备上为该工具保存的凭据。</span>
        </div>
        <ul class="targets" id="targets" hidden></ul>
        <p class="desc" id="trust-note" hidden></p>
      </div>
      <div class="actions">
        <button class="btn" id="cancel" type="button">取消</button>
        <button class="btn" id="allow" type="button" disabled></button>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        var Decision = { Allow: 'allow', Cancel: 'cancel' };
        var bridge = globalThis['claude.internal.localExecConsent'] &&
          globalThis['claude.internal.localExecConsent'].LocalExecConsent;

        // Only the kinds this reconstruction can actually carry out. The
        // original also has connect/disconnect/chat-grant for direct MCP; those
        // need an MCP host that does not exist here, so they are rejected
        // rather than rendered as a prompt that could not be honoured.
        function parseRequest(search) {
          var params = new URLSearchParams(search);
          var kind = params.get('kind');
          if (kind === 'run-command') {
            var command = params.get('command') || '';
            var cwd = params.get('cwd') || '';
            var toolName = params.get('toolName') || '';
            if (!command) return null;
            return { kind: kind, command: command, cwd: cwd, toolName: toolName };
          }
          if (kind === 'apply') {
            var targets = [];
            try {
              var raw = JSON.parse(params.get('targets') || '[]');
              targets = Array.isArray(raw) ? raw.map(function (entry) {
                return entry && typeof entry.display === 'string' && typeof entry.detail === 'string'
                  ? { display: entry.display, detail: entry.detail,
                      origin: typeof entry.origin === 'string' ? entry.origin : undefined }
                  : null;
              }).filter(function (entry) { return entry !== null; }) : [];
            } catch (_e) { targets = []; }
            return targets.length > 0 ? { kind: kind, targets: targets } : null;
          }
          return null;
        }

        var request = parseRequest(window.location.search);

        function byId(id) {
          var node = document.getElementById(id);
          if (!node) throw new Error('consent page: missing #' + id);
          return node;
        }

        var allow = byId('allow');
        var cancel = byId('cancel');
        var dialog = byId('dialog');

        function decide(decision) {
          if (bridge && typeof bridge.choose === 'function') bridge.choose(decision);
        }

        cancel.addEventListener('click', function () { decide(Decision.Cancel); });

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && !event.repeat) decide(Decision.Cancel);
          if (event.key === 'Tab' && !event.ctrlKey && !event.altKey && !event.metaKey) {
            var focusable = [].slice.call(dialog.querySelectorAll('summary, button:enabled'));
            var first = focusable[0];
            var last = focusable[focusable.length - 1];
            var active = document.activeElement;
            var atEdge = active === first || active === dialog || active === document.body;
            if (event.shiftKey && first && last && atEdge) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && first && (active === last || active === document.body)) {
              event.preventDefault();
              first.focus();
            }
          }
        });

        // Strips control characters, matching the original's \p{C} filter.
        function clean(value) { return String(value).replace(/\p{C}/gu, ''); }

        function copyFor(req) {
          switch (req.kind) {
            case 'run-command':
              return {
                title: req.toolName ? '允许执行 ' + req.toolName + '？' : '允许执行命令？',
                desc: 'Claude 将在此设备上运行一条命令。只有在信任它要做的改动时才允许。',
                primary: '允许',
                secondary: '取消',
              };
            case 'apply':
              return {
                title: '应用组织下发的设置？',
                desc: '组织的配置服务器下发了 ' + req.targets.length +
                  ' 项可在此设备上运行的设置，可能改变登录位置或请求发往何处：',
                primary: '允许',
                secondary: '退出',
              };
            default:
              return req;
          }
        }

        if (request !== null) {
          var copy = copyFor(request);
          byId('title').textContent = copy.title;
          byId('desc').textContent = copy.desc;
          allow.textContent = copy.primary;
          cancel.textContent = copy.secondary;
          byId('warn').hidden = request.kind !== 'disconnect';
          dialog.setAttribute('aria-describedby',
            request.kind === 'apply' ? 'desc trust-note'
              : request.kind === 'disconnect' ? 'desc warn'
                : 'desc');

          if (request.kind === 'run-command') {
            // The command and its working directory are shown verbatim so the
            // decision is made on the actual bytes, not a summary.
            var list = byId('targets');
            list.hidden = false;
            var item = document.createElement('li');
            var details = document.createElement('details');
            details.open = true;
            var summary = document.createElement('summary');
            summary.textContent = clean(request.command);
            details.appendChild(summary);
            if (request.cwd) {
              var detail = document.createElement('div');
              detail.className = 'detail';
              detail.textContent = '工作目录：' + clean(request.cwd);
              details.appendChild(detail);
            }
            item.appendChild(details);
            list.appendChild(item);
          }

          if (request.kind === 'apply') {
            var targetList = byId('targets');
            targetList.hidden = false;
            request.targets.forEach(function (target) {
              var li = document.createElement('li');
              var det = document.createElement('details');
              var sum = document.createElement('summary');
              sum.textContent = clean(target.display);
              if (target.origin) {
                var origin = document.createElement('span');
                origin.className = 'origin';
                origin.textContent = clean(target.origin);
                sum.appendChild(origin);
              }
              var body = document.createElement('div');
              body.className = 'detail';
              body.textContent = clean(target.detail);
              det.appendChild(sum);
              det.appendChild(body);
              li.appendChild(det);
              targetList.appendChild(li);
            });
            var note = byId('trust-note');
            note.hidden = false;
            note.textContent = '仅当你信任组织的 IT 且预期这些配置时才允许。若退出，组织设置不会被应用，下次启动时 Claude 会再次询问。';
          }

          allow.addEventListener('click', function () { decide(Decision.Allow); });

          // Guard against a double click landing on a just-replaced button, and
          // keep the buttons inert until the window has focus (the original
          // does the same so a click that opened the window cannot confirm it).
          var quitsOnCancel = request.kind === 'apply';
          var timer;
          function settle() {
            allow.disabled = true;
            cancel.disabled = quitsOnCancel;
            clearTimeout(timer);
            timer = setTimeout(function () {
              allow.disabled = false;
              if (quitsOnCancel) cancel.disabled = false;
              if (document.activeElement === document.body) dialog.focus();
            }, 500);
          }
          window.addEventListener('focus', settle);
          // requestAnimationFrame is throttled in a window that is not being
          // painted, so it cannot be the only trigger: a prompt opened behind
          // another window would leave its buttons disabled forever. A timer
          // fallback guarantees the buttons become usable either way.
          requestAnimationFrame(function () {
            requestAnimationFrame(settle);
          });
          setTimeout(settle, 0);
        }

        if (request === null || request.kind === 'apply') dialog.focus();
        else cancel.focus();
      })();
    </script>
  </body>
</html>
